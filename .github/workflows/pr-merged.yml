name: PR Merged — App CI + Push
on:
  push:
    branches: [main]
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-build.yml@v3.2
    with:
      project-name: "walterdmt88-taskmanager"
      service-name: "frontend-service"
      service-port: "3000"
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-dev:
    needs: build
    uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: dev
      project-name: "walterdmt88-taskmanager"
      service-name: "frontend-service"
      # no runtime secrets — VITE_API_BASE_URL is baked in at Docker build time
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-staging:
    needs: [build, deploy-dev]   # gated by dev — same image-tag, no rebuild
    uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: staging
      project-name: "walterdmt88-taskmanager"
      service-name: "frontend-service"
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  deploy-prod:
    needs: [build, deploy-staging]   # gated by staging — same image-tag, no rebuild
    uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v3
    with:
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: prod   # required reviewers on this GitHub Environment pause the run for approval
      project-name: "walterdmt88-taskmanager"
      service-name: "frontend-service"
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
